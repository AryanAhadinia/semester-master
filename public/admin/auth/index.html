<!doctype html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.rtl.min.css"
        integrity="sha384-mUkCBeyHPdg0tqB6JDd+65Gpw5h/l8DKcCTV2D2UpaMMFd7Jo8A+mDAosaWgFBPl" crossorigin="anonymous">
    <link href="https://v1.fontapi.ir/css/Sahel" rel="stylesheet">

    <style>
        body {
            font-family: 'Sahel', sans-serif;
            background-image: linear-gradient(to right, rgba(255, 0, 0, 0), rgba(64, 185, 255, 0.521));
        }
    </style>

    <title>ورود مدیر</title>
    <link rel="shortcut icon" type="image/png" href="/media/favicon.png" />
</head>

<body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-ygbV9kiqUc6oa4msXn9868pTtWMgiQaeYH7/t7LECLbyPA2x65Kgf80OJFdroafW"
        crossorigin="anonymous"></script>

    <div class="card text-center"
        style="width: 40vw; margin: auto; position: absolute; top: 40%; left: 50%; transform: translate(-50%, -50%);">
        <div class="card-body">
            <form class="row g-3 needs-validation" novalidate>
                <div class="col-pane">
                    <div class="form-floating mb-3">
                        <input type="email" class="form-control" id="email" placeholder="email"
                            style="text-align: center;" required>
                        <label for="email">پست الکترونیک</label>
                    </div>
                </div>
                <div class="col-pane">
                    <div class="form-floating mb-3">
                        <input type="password" class="form-control" id="password" placeholder="password"
                            style="text-align: center;" required>
                        <label for="password">رمز عبور</label>
                    </div>
                </div>

                <div class="col-pane">
                    <div id="alert_placeholder"></div>
                </div>

                <div class="col-pane">
                    <div class="d-grid gap-2">
                        <button class="btn btn-lg btn-outline-primary" id="signin" type="submit">
                            ورود مدیر
                        </button>
                    </div>
                </div>
            </form>

        </div>
    </div>

    <script>
        (function () {
            'use strict';
            window.addEventListener('load', function () {
                var forms = document.getElementsByClassName('needs-validation');
                var validation = Array.prototype.filter.call(forms, function (form) {
                    form.addEventListener('submit', function (event) {
                        if (form.checkValidity() === false) {
                            event.preventDefault();
                            event.stopPropagation();
                        }
                        form.classList.add('was-validated');
                    }, false);
                });
            }, false);
        })();
    </script>
    <script src="./controller.js"></script>
</body>

</html>
